<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Events Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Auth Screen (Login/Register) -->
    <div id="auth-screen" style="display:none;">
      <div class="auth-container">
        <div class="auth-box">
         <img src="logo.png" class="auth-logo" alt="EEH">
          <h2 class="auth-title">Welcome Back</h2>
          <p class="auth-subtitle">Sign in to unlock exclusive events</p>

          <div id="login-form">
            <input type="email" id="auth-email" placeholder="Email address">
            <input type="password" id="auth-password" placeholder="Password">
            <button id="btn-login" class="btn btn-primary">Sign In</button>
            <button id="btn-show-register" class="btn btn-secondary">Create Account</button>
          </div>

          <div id="register-form" style="display:none;">
            <input type="text" id="reg-name" placeholder="Full name">
            <input type="email" id="reg-email" placeholder="Email address">
            <input type="password" id="reg-password" placeholder="Password (min 6 chars)">
            <button id="btn-register" class="btn btn-primary">Create Account</button>
            <button id="btn-show-login" class="btn btn-secondary">Already have account? Sign In</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Main App -->
    <div id="main-app" style="display:none;">
      <header class="header">
        <div class="logo">
          <img src="logo.png" alt="EEH" class="logo-img">
          <div class="logo-text">
            <h1>Elite Events Hub</h1>
            <span class="tagline">Exclusive luxury experiences</span>
          </div>
        </div>
        <div class="header-actions">
          <span id="tier-badge" class="badge">FREE</span>
          <button id="btn-logout" class="btn-logout" title="Logout">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <nav class="category-tabs">
        <button class="tab active" data-category="all">All</button>
        <button class="tab" data-category="auctions">Auctions</button>
        <button class="tab" data-category="sports">Sports</button>
        <button class="tab" data-category="yachts">Yachts</button>
      </nav>

      <main id="main-content"></main>

      <nav class="bottom-nav">
        <button class="nav-item active" data-view="feed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          <span>Feed</span>
        </button>
        <button class="nav-item" data-view="calendar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span>Calendar</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>Settings</span>
        </button>
      </nav>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
